[project]
name = "ai-steppe-starter"
version = "0.1.0"
description = "Secure, case-adaptable AI/Cybersecurity hackathon starter for team two_digits"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "fpdf2>=2.8.3",
    "google-genai>=1.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
local = [
    "faster-whisper>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
