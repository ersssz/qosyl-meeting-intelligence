services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/audit.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - audit-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ui:
    build: .
    environment:
      API_URL: http://api:8000
      UI_REQUEST_TIMEOUT_SECONDS: "${UI_REQUEST_TIMEOUT_SECONDS:-20}"
    command:
      [
        "streamlit",
        "run",
        "streamlit_app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
      ]
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  audit-data:
